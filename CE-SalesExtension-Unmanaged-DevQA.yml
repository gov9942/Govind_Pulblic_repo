name: "$(unmanaged_releasenumber)$(Rev:r)"
trigger: 
- none
pool:
  name: 'IST-CE-DEV-QA'
  vmimage: 'windows-latest'

parameters:
  - name: saveziptorepo
    displayName: 'Save ZIP file to repo?'
    type: string
    values:
      - true
      - false
    default: false
  - name: Environments
    type: object
    default:
      - name: jts-devqa-dataverse-connection-reference
        connectionid: shared-commondataser-97368d5a-5be1-4c6a-b2ab-39d0bec3e4c0

variables:
- group: OPGT
- name: srcenv
  value: 'D365-Jts-Dev2'
- name: destenv
  value: 'D365-Jts-DevQa'
- name: PowerPlatformSPN
- name: reponame
  value: $(Build.Repository.Name)
- name: commitmessage
  value: 'Sales_Ext'
- name: repobranch
  value: $(Build.SourceBranchName)
- name: repopath
  value: 'D365/CE/Solutions/SalesExtension'
- name: solutionname
  value: $(extsolutionname)
- name: repopathpacked
  value: 'D365/CE/Solutions/packed'
- name: ismanaged
  value: 'False'
- name: artifactname
  value: $(solutionname)
- name: publish
- name: filepath
  value: '$(System.DefaultWorkingDirectory)\$(artifactname)\$(solutionname)_$(versionnumber).zip'
- name: settingsRepopath
  value: '$(System.DefaultWorkingDirectory)\D365\CE\Settings'
- name: solutionfilepath
  value: '$(Build.ArtifactStagingDirectory)\$(solutionname)_$(versionnumber).zip'
- name: UseDeploymentSettingsFile
  value: true
- name: DeploymentSettingsFile
  value: '$(System.DefaultWorkingDirectory)\$(artifactname)\jts-devqa\deploymentsettings.json'

stages:
- stage: Build
  jobs:
    - deployment: 'Ext_Unmanaged'
      environment: 'opgt'
    - job: Basic_Tasks
      dependsOn: 'Ext_Unmanaged'
      condition: succeeded()
      steps:
      - checkout: self
        clean: true
        persistCredentials: true
      - template: basictask.yml
        parameters:
         srcenv: $(srcenv)

    - job: build_solution
      continueOnError: false
      dependsOn: Basic_Tasks
      condition: succeeded()
      timeoutInMinutes: 60
      steps:
      - checkout: self
        clean: true
        persistCredentials: true

      - template: powershell-clean.yml
        parameters:
          repobranch: $(repobranch)
          repopath: $(repopath)
          solutionname: $(solutionname)

      - template: solutionbuild.yml
        parameters:
          srcenv: $(srcenv)
          ismanaged: $(ismanaged)
          solutionname: '$(solutionname)'
          artifactname: '$(artifactname)'

      - task: NuGetToolInstaller@1
        displayName: 'Use NuGet '
      - task: NuGetCommand@2
        displayName: 'NuGet custom'
        inputs:
          command: custom
          arguments: 'install Microsoft.PowerApps.CLI -OutputDirectory pac'
              
      - ${{ each env in parameters.Environments }}:
        - template: Generate-deploy-setting.yml
          parameters:
            solutionfilepath: $(solutionfilepath)
            connectionname: '${{ env.name }} '
            connectionid: '${{ env.connectionid }} '
            artifactname: '$(artifactname)'
            settingsRepopath: '$(settingsRepopath)'

      - template: powershell-commit-test.yml
        parameters:
          reponame: $(Build.Repository.Name)
          repobranch: $(repobranch)
          repopath: $(settingsRepopath)
          commitmessage: 'Deploy Settings - $(versionnumber)'

      - task: CopyFiles@2
        displayName: 'Copy Files'
        inputs:
          SourceFolder: '$(Build.ArtifactStagingDirectory)'
          Contents: |
            $(solutionname)_$(versionnumber).zip
          TargetFolder: $(repopathpacked)

      - ${{ if not(eq(parameters.saveziptorepo, true)) }}:
        - task: PowerPlatformUnpackSolution@2
          displayName: 'Power Platform Unpack Solution '
          inputs:
            SolutionInputFile: '$(Build.ArtifactStagingDirectory)\$(solutionname)_$(versionnumber).zip'
            SolutionTargetFolder: $(repopath)
            SolutionType: unmanaged
        - template: powershell-commit.yml
          parameters:
            reponame: $(Build.Repository.Name)
            repobranch: $(repobranch)
            repopath: $(repopath)
            commitmessage: '$(solutionname)-$(versionnumber)'

      - ${{ if eq(parameters.saveziptorepo, true) }}:
        - template: powershell-commit.yml
          parameters:
            reponame: $(Build.Repository.Name)
            repobranch: $(repobranch)
            repopath: $(repopathpacked)
            commitmessage: 'Packed - $(solutionname)-$(versionnumber)'

- stage: Test
  dependsOn: Build
  jobs:
    - job: test
      condition: true
      steps:
      - checkout: none
      - script: 
          echo "Automation Test"

- stage: Deploy
  dependsOn: Build
  condition: succeeded()
  jobs:
    - job: Deploy
      condition: true
      steps:
      - template: deploy.yml
        parameters:
          destenv: $(destenv)
          ismanaged: $(ismanaged)
          publish: 'true'
          filepath: '$(System.DefaultWorkingDirectory)\$(artifactname)\$(solutionname)_$(versionnumber).zip'
          solutionname: $(solutionname)
          artifactname: $(artifactname)
          UseDeploymentSettingsFile: true
          DeploymentSettingsFile: $(DeploymentSettingsFile)

          #UseDeploymentSettingsFile: False
          #DeploymentSettingsFile: '$(System.DefaultWorkingDirectory)\$(artifactname)\qa\deploymentsettings.json'

