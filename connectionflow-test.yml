parameters:
- name: solutionname
  type: string
  default: 'opgt'
- name: destenv
  type: string

steps:
- task: microsoft-IsvExpTools.PowerPlatform-BuildTools.tool-installer.PowerPlatformToolInstaller@2
  displayName: 'Power Platform Tool Installer '
  
- task: microsoft-IsvExpTools.PowerPlatform-BuildTools.set-Connection-Variables.PowerPlatformSetConnectionVariables@2
  displayName: 'Set Connection Variables'
  name: connectionVariables
  inputs:
    authenticationType: PowerPlatformSPN
    PowerPlatformSPN: $(destenv)


- task: PowerShell@2
  enabled: true
  displayName: 'Powershell'
  continueOnError: true
  env:
    SYSTEM_ACCESSTOKEN: $(system.accesstoken)
  inputs:
    targetType: 'inline'
    script: |
        # Write your PowerShell commands here.
        Write-Host "Rule publish"
        Write-Host "EnvironmentUrl:$(BuildTools.EnvironmentUrl)"
        $connectionString="AuthType=ClientSecret;url=$(BuildTools.EnvironmentUrl);ClientId=$(connectionVariables.BuildTools.ApplicationId);ClientSecret=$(connectionVariables.BuildTools.ClientSecret)"
        # Login to PowerApps for the Admin commands
        Write-Host "Login to PowerApps for the Admin commands"
        #start-process PowerShell -verb runas
        #Install-Module -Name NuGet -Force
        Install-Module  Microsoft.PowerApps.Administration.PowerShell -RequiredVersion "2.0.105" -Force -Scope CurrentUser
        Write-Host "test1"
        Write-Host "TenantID:$(connectionVariables.BuildTools.TenantId) - ApplicationId:$(connectionVariables.BuildTools.ApplicationId) - ClientSecret:$(connectionVariables.BuildTools.ClientSecret)"
        Add-PowerAppsAccount -TenantID '$(connectionVariables.BuildTools.TenantId)' -ApplicationId '$(connectionVariables.BuildTools.ApplicationId)' -ClientSecret '$(connectionVariables.BuildTools.ClientSecret)' -Endpoint "prod"
        
        # Login to PowerApps for the Xrm.Data commands
        Write-Host "Login to PowerApps for the Xrm.Data commands"
        Install-Module  Microsoft.Xrm.Data.PowerShell -RequiredVersion "2.8.14" -Force -Scope CurrentUser
        $conn = Get-CrmConnection -ConnectionString $connectionString
        $conns=( ConvertTo-Json ( $conn)) -replace "`n|`r",""
        #   Write-Host "Connection-first: $conn "
        
        # Get the flows that are turned off
        Write-Host "Get Flows that are turned off"
        $fetchFlows = @"
        <fetch>
        <entity name='workflow' >
            <attribute name='category' />
            <attribute name='name' />
            <attribute name='statecode' />
            <attribute name='workflowid' />
            <attribute name='ownerid' />
            <filter type='and' >
            <condition attribute='category' operator='eq' value='5' />
            <condition attribute='statecode' operator='eq' value="Draft" />
            </filter>
            <link-entity name='solutioncomponent' from='objectid' to='workflowid' >
            <filter>
                <condition attribute='solutionidname' operator='eq' value='$(extsolutionname)' />
            </filter>
            </link-entity>
        </entity>
        </fetch>
        "@;      
        
        $flows = (Get-CrmRecordsByFetch  -conn $conn -Fetch $fetchFlows -Verbose).CrmRecords
        if ($flows.Count -eq 0)
        {
            Write-Host "##vso[task.logissue type=warning]No Flows that are turned off in $(extsolutionname)."
            Write-Output "No Flows that are turned off"
            #exit(0)
        }

        $Existingflow = (ConvertTo-Json ($flows | Select-Object -Property category,name,statecode)) -replace "`n|`r",""
        Write-Host "##vso[task.setvariable variable=CONNECTION_REFS]$Existingflow"
        Write-Host "existing Existingflow:$Existingflow"

        # Turn on flows
        foreach ($flow in $flows){
        try {
            Write-Output "Turning on Flow:$(($flow).name)"
            Set-CrmRecordState -EntityLogicalName workflow -Id $flow.workflowid -StateCode Activated -StatusCode Activated -Verbose -Debug
        }
        catch {
            Write-Warning "An error occored when activating flow:$(($flow).name)"
            Write-Warning $_
        }    
        }

